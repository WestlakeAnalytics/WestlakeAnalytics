 for(let i=0;i<t.length;i++){const c=t[i];

// legend: one bar across the width, filled by each region's share of all wins

const BWD=70,BHT=10,LY0=207,TOT=STORY.total;
[['Europe','Europe'],['Africa','Africa'],['Asia','Asia'],['North America','N. America'],['South America','S. America']].forEach(([k,l],i)=>{
 const cx=275+(i-2)*COLW, n=STORY.byCont[k], w=Math.max(n/TOT*BWD,3), eu=k==='Europe';
 A(`<text class="b" x="${cx}" y="${LY0}" text-anchor="middle" font-size="11" font-weight="${eu?700:400}" fill="${eu?ORANGE:INK}">${l}</text>`);
 A(`<rect x="${cx-BWD/2}" y="${LY0+7}" width="${BWD}" height="${BHT}" rx="5" fill="#F0F2F5"/>`);
 A(`<rect x="${cx-BWD/2}" y="${LY0+7}" width="${w}" height="${BHT}" rx="5" fill="${COL[k]||NAVY}"/>`);
 A(`<text class="b" x="${cx}" y="${LY0+31}" text-anchor="middle" font-size="12" font-weight="700" fill="${eu?ORANGE:INK}">${n}</text>`)});
// column headers
ORDER.forEach((r,i)=>{const nm=r==='New York City'?'New York':r;
 A(`<text class="b" x="${colX(i)+35}" y="${TOP-17}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${NAVY}">${nm}</text>`);
 A(`<text class="b" x="${colX(i)+35-11}" y="${TOP-5}" text-anchor="middle" font-size="9" font-style="italic" fill="${SOFT}">M</text>`);

// year labels
for(let y=Y0;y<=Y1;y++){const big=y%10===0;
 A(`<text class="b" x="${X0-8}" y="${rowY(y)+RH/2+3.5}" text-anchor="end" font-size="${big?13:10}" font-style="italic" font-weight="${big?700:400}" fill="${big?INK:SOFT}">${y}</text>`)}
// squares

ORDER.forEach((r,i)=>A(`<line x1="${colX(i)+35}" x2="${colX(i)+35}" y1="${TOP}" y2="${TOP+(Y1-Y0+1)*RH-6}" stroke="#E6E9EE" stroke-width="1"/>`));

all.forEach(d=>{
 const [x,y]=pos(d), c=COL[d.cont], eu=d.cont==='Europe';
